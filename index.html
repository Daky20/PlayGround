<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICE GRID ’98 — City of Chaos</title>
<style>
:root{color-scheme:dark;--gold:#e4cc68;--panel:#151d1c;--edge:#435147}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080d0c;color:#d8e0ce;font:13px ui-monospace,Menlo,Consolas,monospace;display:grid;place-items:center}#app{width:min(1200px,100%);padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;padding:0 2px 8px;border-bottom:2px solid #293b33}h1{font-size:19px;letter-spacing:2px;color:var(--gold);margin:0}.subtitle{font-size:10px;color:#87968a}.hud{display:flex;gap:6px;flex-wrap:wrap}.chip,.box{padding:7px 10px;background:var(--panel);border:1px solid var(--edge)}.chip{white-space:nowrap}.chip strong{color:var(--gold)}canvas{display:block;width:100%;height:auto;background:#202927;border:4px solid #414a3e;image-rendering:pixelated;box-shadow:0 15px 48px #000}#footer{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:8px}#mission{border-left:4px solid #a8cf72;min-height:48px}#missionTitle{color:var(--gold)}#missionText{margin-top:3px;color:#c0cbc0}#help{text-align:right;color:#87968a;font-size:11px;line-height:1.55}#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:5;display:none;padding:10px 16px;background:#111917;border:2px solid var(--gold);color:#fff;text-align:center}#overlay{position:fixed;inset:0;display:none;place-items:center;background:#050908dd;z-index:8;text-align:center}#overlay>div{padding:26px 36px;background:var(--panel);border:2px solid var(--gold)}#touch{display:none;position:fixed;inset:auto 12px 12px;z-index:6;justify-content:space-between;align-items:end;pointer-events:none}.pad,.actions{pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px}.pad button,.actions button{touch-action:none;color:#f4df85;background:#14201bdd;border:1px solid #8e9b7c;border-radius:5px}.pad .blank{visibility:hidden}.actions{display:flex;gap:5px}.actions button{width:58px;height:48px;font:10px inherit}@media(max-width:720px){body{display:block;min-height:100dvh}#app{padding:7px}h1{font-size:15px}.subtitle{font-size:9px}.chip{font-size:10px;padding:4px 6px}#footer{grid-template-columns:1fr}#help{text-align:left}canvas{max-height:68vh;object-fit:contain}#touch{display:flex}}
</style>
</head>
<body>
<main id="app"><header><h1>VICE GRID ’98 <span class="subtitle">// CITY OF CHAOS</span></h1><div class="hud"><span class="chip">SCORE <strong id="score">000000</strong></span><span class="chip">CASH <strong id="cash">$500</strong></span><span class="chip">LIVES <strong id="lives">♥ ♥ ♥</strong></span><span class="chip">TIME <strong id="time">08:00</strong></span><span class="chip">WANTED <strong id="wanted">☆☆☆☆☆</strong></span></div></header>
<canvas id="game" width="1000" height="620" aria-label="Top-down city driving game"></canvas>
<div id="footer"><section class="box" id="mission"><b id="missionTitle">PAYPHONE // READY</b><div id="missionText">Find a payphone and press E to take a gang job.</div></section><aside class="box" id="help">WASD / ARROWS — move & drive · SPACE — handbrake<br>E / ENTER — use / enter car · P — pause · R — restart</aside></div></main>
<div id="toast" role="status"></div><div id="overlay"><div><h2 id="overlayTitle">PAUSED</h2><p id="overlayText">Press P or ENTER to continue</p></div></div>
<div id="touch"><div class="pad"><button class="blank">.</button><button data-key="arrowup">▲</button><button class="blank">.</button><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div><div class="actions"><button data-action="use">USE<br>E</button><button data-key=" ">BRAKE</button></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,T=300,R=88,world=T*6;
const el=id=>document.getElementById(id),ui={score:el('score'),cash:el('cash'),lives:el('lives'),time:el('time'),wanted:el('wanted'),missionTitle:el('missionTitle'),missionText:el('missionText'),toast:el('toast'),overlay:el('overlay'),overlayTitle:el('overlayTitle'),overlayText:el('overlayText')};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const keys=new Set(),buildings=[],cars=[],trees=[],phones=[],people=[],cops=[];
const factions=[{name:'ZAIBATSU',color:'#dc5046'},{name:'LOONIES',color:'#dabd48'},{name:'YAKUZA',color:'#579b9b'}];
let score=0,cash=500,lives=3,wanted=0,clock=480,paused=false,dead=false,toastLeft=0,phoneIndex=0,mission=null,missionSerial=0,heatTimer=0,gameTime=0;
const player={x:44,y:44,dir:0,r:8,inCar:null,invuln:0},camera={x:0,y:0};
const colors=['#aa5747','#c4a846','#507f89','#667b50','#8d6389','#a77349','#b3b0a1','#657a9d'];
for(let gy=0;gy<6;gy++)for(let gx=0;gx<6;gx++){
 const bx=gx*T,by=gy*T,type=(gx*3+gy*5)%8;
 buildings.push({x:bx+R+17,y:by+R+17,w:T-R-34,h:T-R-34,type,seed:gx*19+gy*37});
 trees.push({x:bx+R+8,y:by+R+8},{x:bx+T-9,y:by+R+8},{x:bx+R+8,y:by+T-9},{x:bx+T-9,y:by+T-9});
 if(Math.random()<.78)for(let lane=0;lane<2;lane++){let horiz=Math.random()<.5,offset=lane?62:27;cars.push({x:horiz?bx+rand(R+20,T-35):bx+offset,y:horiz?by+offset:by+rand(R+20,T-35),dir:horiz?0:Math.PI/2,color:colors[Math.floor(Math.random()*colors.length)],speed:0,occupied:false,r:13})}
 if((gx+gy)%3===0)people.push({x:bx+R/2,y:by+R/2,color:['#d4c396','#96aeb0','#a4ad7a'][Math.floor(Math.random()*3)]});
}
const phoneSpots=[{x:44,y:44,f:0},{x:world-44,y:T+44,f:1},{x:T+44,y:world-44,f:2},{x:world-44,y:world-44,f:0},{x:T*3+44,y:T*2+44,f:1},{x:T*4+44,y:T*4+44,f:2}];phones.push(...phoneSpots);let target={x:T*4+44,y:T*3+44};
function notice(text){ui.toast.textContent=text;ui.toast.style.display='block';toastLeft=2.3}
function solid(x,y,r){return x<r||y<r||x>world-r||y>world-r||buildings.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}
function move(e,dx,dy,r=e.r||8){const x=e.x+dx,y=e.y+dy;if(!solid(x,e.y,r))e.x=x;else if(e.inCar)e.speed*=-.23;if(!solid(e.x,y,r))e.y=y;else if(e.inCar)e.speed*=-.23;e.x=clamp(e.x,r,world-r);e.y=clamp(e.y,r,world-r)}
function updateHud(){ui.score.textContent=String(score).padStart(6,'0');ui.cash.textContent='$'+cash;ui.lives.textContent='♥ '.repeat(Math.max(0,lives)).trim()||'—';ui.time.textContent=String(Math.floor(clock/60)%24).padStart(2,'0')+':'+String(Math.floor(clock)%60).padStart(2,'0');ui.wanted.textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted)}
function setMissionText(){const gang=factions[mission?.faction??phoneSpots[phoneIndex].f];ui.missionTitle.textContent=mission?gang.name+' // '+mission.name:'PAYPHONE // READY';ui.missionTitle.style.color=gang.color;ui.missionText.textContent=mission?mission.text:'Find a payphone and press E to take a gang job.'}
function nearestCar(){return cars.filter(c=>!c.occupied&&dist(c,player)<35).sort((a,b)=>dist(a,player)-dist(b,player))[0]}
function spawnJob(phone){missionSerial++;const faction=phone.f,markedCar=cars.filter(c=>!c.occupied).sort((a,b)=>dist(a,phone)-dist(b,phone))[0],origin=markedCar?{x:markedCar.x,y:markedCar.y}:{x:phone.x,y:phone.y},dest=phoneSpots.filter(p=>dist(p,origin)>250).sort((a,b)=>dist(a,origin)-dist(b,origin))[0]||phoneSpots[(phoneIndex+1)%phones.length];mission={faction,name:'JOB '+String(missionSerial).padStart(2,'0'),stage:0,origin,destination:{x:dest.x,y:dest.y},text:'Steal the marked car and take it to the drop.'};target=mission.origin;wanted=Math.max(wanted,1);setMissionText();notice(factions[faction].name+': job accepted.')}
function completeJob(){if(!mission)return;if(mission.stage===0){mission.stage=1;mission.text='Deliver the stolen car to the marked drop zone.';target=mission.destination;setMissionText();notice('Vehicle secured. Deliver it to the drop.');return}const reward=500+missionSerial*125;cash+=reward;score+=reward*10;wanted=Math.max(0,wanted-2);mission=null;phoneIndex=(phoneIndex+1)%phones.length;setMissionText();notice('Job complete! +$'+reward);updateHud()}
function interact(){if(dead)return;if(player.inCar){const c=player.inCar;if(Math.abs(c.speed)>1.1){notice('Slow down before leaving the car.');return}const ex=c.x+Math.cos(c.dir+Math.PI/2)*24,ey=c.y+Math.sin(c.dir+Math.PI/2)*24;if(solid(ex,ey,9)){notice('No room to get out here.');return}c.occupied=false;player.inCar=null;player.x=ex;player.y=ey;c.speed=0;return}const car=nearestCar();if(car){car.occupied=true;player.inCar=car;player.dir=car.dir;if(mission&&mission.stage===0&&dist(car,mission.origin)<70)completeJob();else{wanted=Math.min(5,wanted+1);notice('Car stolen — heat increased!')}return}const phone=phones.find(p=>dist(p,player)<30);if(phone){if(mission){notice('Finish your active job first.');return}phoneIndex=phones.indexOf(phone);spawnJob(phone)}}
function togglePause(){if(dead)return;paused=!paused;ui.overlay.style.display=paused?'grid':'none';ui.overlayTitle.textContent='PAUSED';ui.overlayText.textContent='Press P or ENTER to continue'}
function resetGame(){score=0;cash=500;lives=3;wanted=0;clock=480;paused=false;dead=false;mission=null;missionSerial=0;phoneIndex=0;cops.length=0;player.x=44;player.y=44;player.invuln=0;if(player.inCar){player.inCar.occupied=false;player.inCar.speed=0;player.inCar=null}ui.overlay.style.display='none';setMissionText();updateHud();notice('New shift started.')}
function loseLife(){if(player.invuln>0)return;lives--;cash=Math.max(0,cash-150);wanted=0;cops.length=0;if(player.inCar){player.inCar.occupied=false;player.inCar.speed=0;player.inCar=null}player.x=44;player.y=44;player.invuln=2;mission=null;setMissionText();if(lives<=0){dead=true;ui.overlay.style.display='grid';ui.overlayTitle.textContent='WASTED';ui.overlayText.textContent='Press R to start a new run'}else notice('Busted! Lost a life and $150.');updateHud()}
function spawnCop(){const a=rand(0,Math.PI*2),r=rand(350,520);return{x:clamp(player.x+Math.cos(a)*r,25,world-25),y:clamp(player.y+Math.sin(a)*r,25,world-25),dir:0,speed:0,r:14,police:true}}
function update(dt){if(paused||dead)return;gameTime+=dt;clock=(clock+dt*1.6)%(24*60);if(toastLeft>0&&(toastLeft-=dt)<=0)ui.toast.style.display='none';player.invuln=Math.max(0,player.invuln-dt);const up=keys.has('w')||keys.has('arrowup'),down=keys.has('s')||keys.has('arrowdown'),left=keys.has('a')||keys.has('arrowleft'),right=keys.has('d')||keys.has('arrowright'),brake=keys.has(' ');
 if(player.inCar){const c=player.inCar;if(up)c.speed=Math.min(4.5,c.speed+.105*dt*60);else if(down)c.speed=Math.max(-1.9,c.speed-.12*dt*60);else c.speed*=Math.pow(.985,dt*60);if(brake)c.speed*=Math.pow(.9,dt*60);const steer=(right?1:0)-(left?1:0);if(steer)c.dir+=steer*Math.min(1,Math.abs(c.speed)/2.5)*.043*dt*60*(c.speed<0?-1:1);move(c,Math.cos(c.dir)*c.speed*dt*60,Math.sin(c.dir)*c.speed*dt*60,14);player.x=c.x;player.y=c.y;
  if(Math.abs(c.speed)>1.3)for(const p of people)if(dist(c,p)<17){p.x=rand(30,world-30);p.y=rand(30,world-30);c.speed*=.65;cash=Math.max(0,cash-100);wanted=Math.min(5,wanted+1);notice('Pedestrian struck — police alerted!');break}
  for(const other of cars)if(other!==c&&dist(c,other)<25){c.speed*=-.35;other.speed=0;break}
 }else{let dx=(right?1:0)-(left?1:0),dy=(down?1:0)-(up?1:0);if(dx||dy){const len=Math.hypot(dx,dy);dx/=len;dy/=len;player.dir=Math.atan2(dy,dx);move(player,dx*2.15*dt*60,dy*2.15*dt*60,player.r)}}
 if(wanted){while(cops.length<wanted)cops.push(spawnCop());while(cops.length>wanted)cops.pop();heatTimer+=dt;for(const cop of cops){const d=dist(cop,player),a=Math.atan2(player.y-cop.y,player.x-cop.x);cop.dir=a;cop.speed=d>24?1.15+wanted*.13:0;move(cop,Math.cos(a)*cop.speed*dt*60,Math.sin(a)*cop.speed*dt*60,14);if(d<20){loseLife();break}}if(heatTimer>22&&!mission){heatTimer=0;wanted=Math.max(0,wanted-1)}}else heatTimer=0;
 if(mission&&mission.stage===1&&player.inCar&&dist(player,target)<43)completeJob();camera.x=clamp(player.x-W/2,0,world-W);camera.y=clamp(player.y-H/2,0,world-H);updateHud()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawGround(){ctx.fillStyle='#252b28';ctx.fillRect(0,0,world,world);for(let n=0;n<6;n++){const q=n*T;ctx.fillStyle='#3b3e39';ctx.fillRect(q,0,R,world);ctx.fillRect(0,q,world,R);ctx.fillStyle='#77745c';for(let v=8;v<world;v+=44){ctx.fillRect(q+R/2-1,v,2,18);ctx.fillRect(v,q+R/2-1,18,2)}ctx.fillStyle='#55574f';ctx.fillRect(q+5,0,2,world);ctx.fillRect(0,q+5,world,2);ctx.fillRect(q+R-7,0,2,world);ctx.fillRect(0,q+R-7,world,2)}for(let gy=0;gy<6;gy++)for(let gx=0;gx<6;gx++){const x=gx*T+R,y=gy*T+R;ctx.fillStyle='#706b54';ctx.fillRect(x+5,y+5,T-R-10,T-R-10);ctx.fillStyle='#827a5c';for(let j=0;j<5;j++){ctx.fillRect(x+12+j*29,y+9,13,3);ctx.fillRect(x+12+j*29,y+T-R-14,13,3)}for(let j=0;j<4;j++){ctx.fillRect(x+8,y+18+j*27,3,13);ctx.fillRect(x+T-R-12,y+18+j*27,3,13)}}}
function drawBuildings(){const palette=['#525c54','#545c62','#78684e','#616957','#6d5351','#4b5b69','#72745e','#605752'];for(const b of buildings){ctx.fillStyle='#171d1a';rr(b.x+7,b.y+9,b.w,b.h,3);ctx.fillStyle=palette[b.type];rr(b.x,b.y,b.w,b.h,3);ctx.fillStyle='#818170';ctx.fillRect(b.x+5,b.y+7,b.w-10,3);ctx.fillStyle='#262e2c';ctx.fillRect(b.x+10,b.y+15,b.w-20,15);ctx.fillStyle=factions[b.seed%3].color;ctx.fillRect(b.x+15,b.y+20,b.w-30,3);ctx.fillStyle='#c2baa0';ctx.font='bold 8px monospace';ctx.fillText(['HOTEL','ARCADE','MARKET','GARAGE','CLUB','OFFICE','DINER','DEPOT'][b.type],b.x+16,b.y+27);ctx.fillStyle='#37413d';for(let xx=b.x+12;xx<b.x+b.w-10;xx+=28)for(let yy=b.y+42;yy<b.y+b.h-15;yy+=33)ctx.fillRect(xx,yy,13,10);ctx.fillStyle='#313a35';ctx.fillRect(b.x+b.w/2-9,b.y+b.h-13,18,13)}}
function drawTrees(){for(const t of trees){ctx.fillStyle='#172019';ctx.beginPath();ctx.arc(t.x+2,t.y+4,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#466248';ctx.beginPath();ctx.arc(t.x,t.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#708052';ctx.beginPath();ctx.arc(t.x-2,t.y-3,3,0,Math.PI*2);ctx.fill()}}
function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.dir);ctx.fillStyle='#111513';rr(-16,-9,34,20,3);ctx.fillStyle=c.police?'#d9d9c9':c.color;rr(-17,-10,34,20,3);ctx.fillStyle='#35464a';ctx.fillRect(-6,-7,13,14);ctx.fillStyle='#a89f79';ctx.fillRect(9,-6,4,12);ctx.fillStyle='#e2d08f';ctx.fillRect(14,-6,2,4);ctx.fillRect(14,3,2,4);ctx.fillStyle='#202322';ctx.fillRect(-12,-12,6,3);ctx.fillRect(4,-12,6,3);ctx.fillRect(-12,9,6,3);ctx.fillRect(4,9,6,3);if(c.police){ctx.fillStyle='#d94b43';ctx.fillRect(-2,-9,4,2);ctx.fillStyle='#5590c2';ctx.fillRect(2,-9,4,2)}ctx.restore()}
function drawPerson(p){ctx.fillStyle='#171b18';ctx.beginPath();ctx.arc(p.x,p.y+2,5,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-4,7,9);ctx.fillStyle='#c6a878';ctx.beginPath();ctx.arc(p.x,p.y-6,3,0,Math.PI*2);ctx.fill()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle='#171b18';rr(-6,-6,14,13,2);ctx.fillStyle='#c5aa7d';ctx.beginPath();ctx.arc(2,0,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8d0b1';ctx.fillRect(-5,-4,6,8);ctx.restore()}
function drawMarker(p,color,label){const pulse=1+Math.sin(gameTime*4)*.1;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.22;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,20*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,12*pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(label,0,-18*pulse);ctx.restore()}
function drawMinimap(){const mw=142,mh=100,x=W-mw-15,y=15,sx=mw/world,sy=mh/world;ctx.save();ctx.fillStyle='#111915e8';ctx.fillRect(x-4,y-4,mw+8,mh+8);ctx.fillStyle='#55574d';for(let n=0;n<6;n++){ctx.fillRect(x+n*T*sx,y,R*sx,mh);ctx.fillRect(x,y+n*T*sy,mw,R*sy)}ctx.fillStyle='#747057';for(const b of buildings)ctx.fillRect(x+b.x*sx,y+b.y*sy,b.w*sx,b.h*sy);for(const p of phones){ctx.fillStyle='#e3c94f';ctx.fillRect(x+p.x*sx-1,y+p.y*sy-1,3,3)}if(mission){ctx.fillStyle='#e66053';ctx.beginPath();ctx.arc(x+target.x*sx,y+target.y*sy,3,0,Math.PI*2);ctx.fill()}for(const c of cops){ctx.fillStyle='#ec554a';ctx.fillRect(x+c.x*sx-1,y+c.y*sy-1,3,3)}ctx.fillStyle='#f2e6c1';ctx.beginPath();ctx.arc(x+player.x*sx,y+player.y*sy,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e4cc68';ctx.strokeRect(x+camera.x*sx,y+camera.y*sy,W*sx,H*sy);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camera.x,-camera.y);drawGround();drawTrees();drawBuildings();for(const p of phones)drawMarker(p,'#e3c94f','PHONE');if(mission)drawMarker(target,'#ed5a4f',mission.stage===0?'CAR':'DROP');for(const c of cars)drawCar(c);for(const p of people)drawPerson(p);for(const c of cops)drawCar(c);if(!player.inCar&&(player.invuln===0||Math.floor(gameTime*12)%2===0))drawPlayer();ctx.restore();drawMinimap();if(player.inCar){ctx.fillStyle='#e4cc68';ctx.font='bold 12px monospace';ctx.fillText('SPEED '+Math.round(Math.abs(player.inCar.speed)*23)+' KM/H',14,H-15)}if(wanted){ctx.fillStyle='#d75c50';ctx.font='bold 11px monospace';ctx.fillText('POLICE RADIO: PURSUIT IN PROGRESS',14,20)}}
function keyDown(event){const key=event.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key))event.preventDefault();if(!keys.has(key)){if(key==='e'||key==='enter'){if(paused)togglePause();else interact()}if(key==='p'||key==='escape')togglePause();if(key==='r')resetGame()}keys.add(key)}
window.addEventListener('keydown',keyDown);window.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('#touch [data-key]').forEach(button=>{const key=button.dataset.key;button.addEventListener('pointerdown',event=>{event.preventDefault();keys.add(key);button.setPointerCapture(event.pointerId)});for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,()=>keys.delete(key))});document.querySelector('[data-action="use"]').addEventListener('pointerdown',event=>{event.preventDefault();interact()});
function frame(now){const dt=Math.min(.05,Math.max(0,(now-(frame.last||now))/1000));frame.last=now;update(dt);draw();requestAnimationFrame(frame)}
setMissionText();updateHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
