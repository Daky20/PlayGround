<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VICE GRID '98 — Deluxe Edition</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b0e;color:#e9e7dc;font-family:ui-monospace,Consolas,monospace;display:flex;justify-content:center;align-items:center}#app{width:100%;max-width:1240px;padding:10px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;border-bottom:2px solid #2d3b42;padding-bottom:6px}h1{font-size:19px;letter-spacing:2px;color:#d8d994;margin:0}.hud{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#151e24;border:1px solid #3c4e56;padding:6px 10px;font-size:12px;color:#c5d0d3;border-radius:3px;white-space:nowrap}canvas{width:100%;height:auto;display:block;border:4px solid #3c4642;background:#1b2628;image-rendering:pixelated;box-shadow:0 16px 50px #000;border-radius:4px}#bottom{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:8px}#mission{background:#151e24;border-left:4px solid #d8d994;padding:8px 12px;font-size:13px;color:#cfd8d6;min-height:48px}#task{margin-top:3px}#help{text-align:right;color:#899895;font-size:11px;line-height:1.55}#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#0d1419;border:2px solid #d8d994;color:#fff;padding:10px 20px;display:none;z-index:10;text-align:center}#pause{display:none;position:fixed;inset:0;z-index:30;background:#080b0edb;place-items:center;text-align:center}#pause>div{background:#151e24;border:2px solid #d8d994;padding:24px}#touch{display:none;position:fixed;inset:auto 12px 14px;z-index:20;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:4px;pointer-events:auto}.pad button,.action button{background:#172329dd;color:#f1df84;border:1px solid #8c9a8b;border-radius:6px;padding:0;touch-action:none}.pad .empty{visibility:hidden}.action{display:flex;gap:6px;pointer-events:auto}.action button{width:58px;height:48px;font-size:11px}@media(max-width:760px){body{min-height:100dvh;align-items:flex-start}#app{padding:7px}header{flex-wrap:wrap}h1{font-size:14px}.chip{font-size:10px;padding:4px 6px}#bottom{grid-template-columns:1fr}#help{text-align:left}#touch{display:flex}canvas{max-height:68vh;object-fit:contain}}
</style></head><body><main id="app"><header><h1>VICE GRID ’98 <span style="color:#7f9094;font-size:12px">// 2x SCALE CITY EDITION</span></h1><div class="hud"><span class="chip" id="cash">$ 250</span><span class="chip" id="time">08:00</span><span class="chip" id="weather">☀️ SUNNY</span><span class="chip" id="wanted">POLICE ☆☆☆☆☆</span></div></header><canvas id="game" width="1024" height="600"></canvas><div id="bottom"><div id="mission"><b style="color:#d8d994">GRADSKI POSAO</b><div id="task">Преузми пакет и испоручи га на означену адресу.</div></div><div id="help">WASD / strelice — kretanje i vožnja · SPACE — drift<br>E / ENTER — uđi / izađi · P — pauza · R — novi početak</div></div></main><div id="toast"></div><div id="touch"><div class="pad"><button class="empty">·</button><button data-key="arrowup">▲</button><button class="empty">·</button><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div><div class="action"><button data-action="interact">ULAZ<br>E</button><button data-key=" ">DRIFT</button></div></div><div id="pause"><div><h2 style="color:#d8d994">PAUZA</h2><p>Pritisni P ili ENTER za nastavak</p></div></div><script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,T=320,R=92,world=T*7;
const $=id=>document.getElementById(id),ui={cash:$('cash'),time:$('time'),weather:$('weather'),wanted:$('wanted'),task:$('task'),toast:$('toast'),pause:$('pause')};
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),keys=new Set();
let cash=250,wanted=0,clock=480,weather='SUNNY',rain=false,weatherTimer=0,toastTimer=0,paused=false,stage=0,deliveries=0,crashes=0;
const player={x:137,y:140,dir:0,inCar:null},camera={x:0,y:0},buildings=[],cars=[],trees=[],cops=[];
const carColors=['#c85b46','#d3b94e','#477e9a','#738b53','#bd7346','#9a6386','#d1d1b4'];
for(let gy=0;gy<7;gy++)for(let gx=0;gx<7;gx++){let type=(gx*3+gy*5)%7;buildings.push({x:gx*T+R+16,y:gy*T+R+16,w:T-R-32,h:T-R-32,type,name:['HOTEL','ARCADE','MARKET','GARAGE','CLUB','OFFICE','DINER'][type]});trees.push({x:gx*T+R+8,y:gy*T+R+8},{x:gx*T+T-10,y:gy*T+R+8},{x:gx*T+R+8,y:gy*T+T-10},{x:gx*T+T-10,y:gy*T+T-10});if(Math.random()<.78)for(let j=0;j<2;j++){let horiz=Math.random()<.5,lane=horiz?gy*T+rnd(18,R-18):gx*T+rnd(18,R-18);cars.push({x:horiz?gx*T+rnd(R+18,T-48):lane,y:horiz?lane:gy*T+rnd(R+18,T-48),dir:horiz?0:Math.PI/2,color:carColors[Math.floor(Math.random()*7)],speed:0,occupied:false})}}
const spots=[{x:151,y:145},{x:world-155,y:155},{x:world-155,y:world-155},{x:160,y:world-155},{x:world/2,y:world/2}];let pickup={...spots[0]},drop={...spots[1]};
function say(text){ui.toast.textContent=text;ui.toast.style.display='block';toastTimer=2.4}function setTask(){ui.task.textContent=stage===0?'Преузми пакет на зеленој ознаци. Избегавај полицију!':'Испоручи пакет на златној ознаци · Награда $'+(120+deliveries*25)+'.'}
function hud(){ui.cash.textContent='$ '+cash;ui.time.textContent=String(Math.floor(clock/60)%24).padStart(2,'0')+':'+String(Math.floor(clock)%60).padStart(2,'0');ui.weather.textContent=(rain?'🌧️ RAIN':'☀️ SUNNY');ui.wanted.textContent='POLICE '+('★'.repeat(wanted))+('☆'.repeat(5-wanted))}
function solid(x,y,r){return x<r||y<r||x>world-r||y>world-r||buildings.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}
function move(e,dx,dy,r=9){let nx=e.x+dx,ny=e.y+dy;if(!solid(nx,e.y,r))e.x=nx;else if(e===player.inCar){e.speed*=-.25;crashes++}if(!solid(e.x,ny,r))e.y=ny;else if(e===player.inCar)e.speed*=-.25;e.x=clamp(e.x,r,world-r);e.y=clamp(e.y,r,world-r)}
function nearestCar(){return cars.filter(c=>!c.occupied&&distance(c,player)<53).sort((a,b)=>distance(a,player)-distance(b,player))[0]}
function complete(){if(stage===0){stage=1;say('Пакет је преузет — испоручи га!')}else{let reward=120+deliveries*25;cash+=reward;deliveries++;stage=0;pickup={...spots[(deliveries+1)%spots.length]};drop={...spots[(deliveries+2)%spots.length]};if(distance(pickup,drop)<100)drop={...spots[(deliveries+3)%spots.length]};wanted=Math.max(0,wanted-1);say('Испорука успешна! +$'+reward)}setTask();hud()}
function interact(){if(player.inCar){let c=player.inCar;c.occupied=false;player.inCar=null;player.x=clamp(c.x+Math.cos(c.dir+Math.PI/2)*25,12,world-12);player.y=clamp(c.y+Math.sin(c.dir+Math.PI/2)*25,12,world-12);c.speed=0;say('Изашао си из возила.');return}let c=nearestCar();if(c){player.inCar=c;c.occupied=true;player.dir=c.dir;wanted=Math.min(5,wanted+1);say('Возило украдено — полиција је обавештена!');return}if(distance(player,stage===0?pickup:drop)<45)complete()}
function reset(){cash=250;wanted=0;clock=480;deliveries=0;stage=0;player.x=137;player.y=140;if(player.inCar)player.inCar.occupied=false;player.inCar=null;cops.length=0;pickup={...spots[0]};drop={...spots[1]};setTask();hud();say('Нова смена почиње!')}
function keyAction(k){if(k==='e'||k==='enter')interact();if(k==='p'||k==='escape'){paused=!paused;ui.pause.style.display=paused?'grid':'none'}if(k==='r')reset()}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(!keys.has(k))keyAction(k);keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('#touch [data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys.delete(k)))});document.querySelector('[data-action=interact]').addEventListener('pointerdown',e=>{e.preventDefault();interact()});const down=(...k)=>k.some(x=>keys.has(x));
function spawnCop(){let a=rnd(0,Math.PI*2),r=rnd(390,600);return{x:clamp(player.x+Math.cos(a)*r,20,world-20),y:clamp(player.y+Math.sin(a)*r,20,world-20),dir:0,speed:0,police:true}}
function update(dt){if(paused)return;clock=(clock+dt*2.2)%(24*60);weatherTimer+=dt;if(weatherTimer>90){weatherTimer=0;rain=Math.random()<.38;say(rain?'Киша пада — путеви су клизави.':'Киша је престала.')}if(toastTimer>0&&(toastTimer-=dt)<=0)ui.toast.style.display='none';let up=down('w','arrowup'),dn=down('s','arrowdown'),lf=down('a','arrowleft'),rt=down('d','arrowright'),hand=down(' ');
if(player.inCar){let c=player.inCar;if(up)c.speed=Math.min(c.speed+(rain?.095:.14)*dt*60,5.3);if(dn)c.speed=Math.max(c.speed-.18*dt*60,-2.2);c.speed*=Math.pow(hand?.91:.985,dt*60);let steer=(rt?1:0)-(lf?1:0);c.dir+=steer*Math.min(Math.abs(c.speed)/3,1)*.045*dt*60*(c.speed<0?-1:1);player.dir=c.dir;move(c,Math.cos(c.dir)*c.speed*dt*60,Math.sin(c.dir)*c.speed*dt*60,15);player.x=c.x;player.y=c.y;if(Math.abs(c.speed)>.8)for(let other of cars)if(other!==c&&distance(c,other)<26){c.speed*=-.4;crashes++;if(crashes%3===0)wanted=Math.min(5,wanted+1);break}}else{let dx=(rt?1:0)-(lf?1:0),dy=(dn?1:0)-(up?1:0);if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;player.dir=Math.atan2(dy,dx);move(player,dx*2.1*dt*60,dy*2.1*dt*60,9)}}
while(cops.length>wanted)cops.pop();if(wanted){while(cops.length<wanted)cops.push(spawnCop());for(let c of cops){let d=distance(c,player),a=Math.atan2(player.y-c.y,player.x-c.x);c.dir=a;c.speed=d>30?1.25+wanted*.2:0;move(c,Math.cos(a)*c.speed*dt*60,Math.sin(a)*c.speed*dt*60,14);if(d<25){cash=Math.max(0,cash-40);wanted=Math.max(0,wanted-1);c.x=clamp(c.x-Math.cos(a)*120,20,world-20);c.y=clamp(c.y-Math.sin(a)*120,20,world-20);if(player.inCar)player.inCar.speed*=.3;say('Полиција те је зауставила: −$40')}}}
if(distance(player,stage===0?pickup:drop)<27)complete();camera.x=clamp(player.x-W/2,0,world-W);camera.y=clamp(player.y-H/2,0,world-H);hud()}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function roads(){ctx.fillStyle='#192327';ctx.fillRect(0,0,world,world);for(let n=0;n<7;n++){let q=n*T;ctx.fillStyle='#353b3a';ctx.fillRect(q,0,R,world);ctx.fillRect(0,q,world,R);ctx.fillStyle='#c2b97c';for(let v=8;v<world;v+=38){ctx.fillRect(q+R/2-2,v,4,19);ctx.fillRect(v,q+R/2-2,19,4)}ctx.fillStyle='#9a9e85';ctx.fillRect(q+4,0,3,world);ctx.fillRect(0,q+4,world,3);ctx.fillRect(q+R-7,0,3,world);ctx.fillRect(0,q+R-7,world,3);for(let v=20;v<world;v+=160){ctx.fillStyle='#ddd6aa';ctx.fillRect(q+12,v,10,3);ctx.fillRect(v,q+12,3,10)}}ctx.font='bold 11px monospace';for(let y=0;y<7;y++)for(let x=0;x<7;x++){ctx.fillStyle='#a1aca255';ctx.fillText(['OLD TOWN','VICE POINT','DOCKSIDE','MIDTOWN','PALM PARK','EAST END','SUNSET'][(x+y*2)%7],x*T+R+22,y*T+R+18)}}
function drawBuildings(){const pal=['#59615a','#515f63','#75634e','#626957','#6d5351','#4d5b6b','#6f705b'],sign=['#a34e43','#d2a648','#54a3a2','#9e6852','#d49a53','#547c9a','#bd594d'];for(const b of buildings){ctx.fillStyle='#101719';rr(ctx,b.x+7,b.y+9,b.w,b.h,7);ctx.fillStyle=pal[b.type];rr(ctx,b.x,b.y,b.w,b.h,7);ctx.fillStyle='#849083';ctx.fillRect(b.x+7,b.y+8,b.w-14,4);ctx.fillStyle='#252e30';rr(ctx,b.x+12,b.y+18,b.w-24,20,2);ctx.fillStyle=sign[b.type];ctx.fillRect(b.x+17,b.y+23,b.w-34,3);ctx.fillStyle='#b9b797';ctx.font='bold 10px monospace';ctx.fillText(b.name,b.x+20,b.y+33);ctx.fillStyle='#303c3c';for(let wx=b.x+18;wx<b.x+b.w-12;wx+=31){for(let wy=b.y+52;wy<b.y+b.h-15;wy+=36){ctx.fillRect(wx,wy,15,12);ctx.fillStyle='#889180';ctx.fillRect(wx+2,wy+2,3,2);ctx.fillStyle='#303c3c'}}ctx.fillStyle='#394440';ctx.fillRect(b.x+b.w/2-10,b.y+b.h-14,20,14)}}
function drawTrees(){for(const t of trees){ctx.fillStyle='#11191a';ctx.beginPath();ctx.arc(t.x+3,t.y+5,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#42634d';ctx.beginPath();ctx.arc(t.x,t.y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#70905c';ctx.beginPath();ctx.arc(t.x-3,t.y-3,4,0,Math.PI*2);ctx.fill()}}
function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.dir);ctx.fillStyle='#101719';rr(ctx,-17,-10,38,23,5);ctx.fillStyle=c.police?'#ece7d4':c.color;rr(ctx,-19,-11,38,22,5);ctx.fillStyle='#293b40';rr(ctx,-7,-8,14,16,3);ctx.fillStyle='#b2c7bd';ctx.fillRect(9,-7,5,14);ctx.fillStyle='#e7d28d';ctx.fillRect(16,-7,2,4);ctx.fillRect(16,4,2,4);ctx.fillStyle='#202326';ctx.fillRect(-13,-13,7,3);ctx.fillRect(4,-13,7,3);ctx.fillRect(-13,10,7,3);ctx.fillRect(4,10,7,3);if(c.police){ctx.fillStyle='#d84949';ctx.fillRect(-3,-10,5,3);ctx.fillStyle='#5e99d5';ctx.fillRect(2,-10,4,3)}ctx.restore()}
function marker(p,color,label){const pulse=1+Math.sin(performance.now()/180)*.12;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.3;ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,23*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,14*pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(label,0,-22*pulse);ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle='#151a19';rr(ctx,-7,-7,17,16,4);ctx.fillStyle='#e2c89b';ctx.beginPath();ctx.arc(2,0,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d6ab66';ctx.fillRect(-6,-5,7,10);ctx.restore()}
function minimap(){let mw=150,mh=112,x=W-mw-16,y=16,sx=mw/world,sy=mh/world;ctx.save();ctx.fillStyle='#0c1314dd';rr(ctx,x-4,y-4,mw+8,mh+8,4);ctx.fillStyle='#444b47';for(let n=0;n<7;n++){ctx.fillRect(x+n*T*sx,y,R*sx,mh);ctx.fillRect(x,y+n*T*sy,mw,R*sy)}ctx.fillStyle='#6b6957';for(const b of buildings)ctx.fillRect(x+b.x*sx,y+b.y*sy,b.w*sx,b.h*sy);markerMini(stage===0?pickup:drop,stage===0?'#62d487':'#f0c84b');ctx.fillStyle='#f3eee1';ctx.beginPath();ctx.arc(x+player.x*sx,y+player.y*sy,3,0,Math.PI*2);ctx.fill();for(const c of cops){ctx.fillStyle='#ef5454';ctx.fillRect(x+c.x*sx-1,y+c.y*sy-1,3,3)}ctx.strokeStyle='#d8d994';ctx.strokeRect(x+camera.x*sx,y+camera.y*sy,W*sx,H*sy);ctx.restore()}
function markerMini(p,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(W-16-150+p.x*150/world,16+p.y*112/world,3,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-camera.x,-camera.y);roads();drawTrees();drawBuildings();marker(stage===0?pickup:drop,stage===0?'#62d487':'#f0c84b',stage===0?'PICKUP':'DROP');for(const c of cars)drawCar(c);for(const c of cops)drawCar(c);if(!player.inCar)drawPlayer();if(rain){ctx.fillStyle='#7594a822';for(let i=0;i<115;i++){let x=(i*97+performance.now()*.18)%W,y=(i*53+performance.now()*.7)%H;ctx.fillRect(camera.x+x,camera.y+y,1,7)}}ctx.restore();minimap();if(player.inCar&&Math.abs(player.inCar.speed)>3){ctx.fillStyle='#d8d994';ctx.font='bold 12px monospace';ctx.fillText('SPEED '+Math.round(Math.abs(player.inCar.speed)*24)+' KM/H',16,H-18)}}
let last=performance.now();function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();requestAnimationFrame(frame)}
setTask();hud();requestAnimationFrame(frame)
})();
</script></body></html>
